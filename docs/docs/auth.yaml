openapi: 3.0.3
info:
  title: Auth Module
  version: 1.0.0
  description: >
    Authentication module providing user registration, login,
    token refreshing, logout and password recovery operations.

servers:
  - url: http://localhost/auth/
    description: Local development server

paths:
  /health:
    get:
      summary: Application health check
      description: Checks the health status of the authentication module.
      tags:
        - Health
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                example:
                  status: ok
        '500':
          description: Service is unavailable

  /sign-up:
    post:
      summary: Register a new user
      description: >
        Creates a new user account, hashes the password, stores user data,
        and issues JWT access & refresh tokens.  
        The refresh token is stored in an HTTP-only cookie.
      tags:
        - Auth
      requestBody:
        description: User registration data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUserDto'
      responses:
        '200':
          description: User registered successfully
          headers:
            Set-Cookie:
              description: HTTP-only cookie containing the refresh token
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '400':
          description: User already exists or invalid data

  /sign-in:
    post:
      summary: Login user
      description: >
        Authenticates the user, validates the password, and returns a new pair
        of JWT tokens.  
        The refresh token is stored in an HTTP-only cookie.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUserDto'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: HTTP-only cookie containing the refresh token
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '400':
          description: Invalid credentials

  /refresh:
    post:
      summary: Refresh access token
      description: >
        Accepts a refresh token from the HTTP-only cookie,
        validates it, and issues a new access & refresh token pair.
      tags:
        - Auth
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              description: Updated HTTP-only refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Invalid or expired refresh token

  /logout:
    post:
      summary: Logout user
      description: >
        Clears the refresh token cookie and invalidates user session.
        Requires access token authentication.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User logged out
          content:
            application/json:
              schema:
                type: object
                example: {}
        '401':
          description: Unauthorized

  /forgot-password:
    post:
      summary: Request password reset email
      description: >
        Sends a password recovery email to the user.  
        (Implementation placeholder — logic not yet implemented.)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              example: "example@gmail.com"
      responses:
        '200':
          description: Email processed (even if account does not exist)
        '400':
          description: Invalid email format

components:
  schemas:
    SignUserDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          minLength: 6
          example: "StrongPassword123"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
