name: neo-nest-dev

services:
  postgres:
    container_name: postgres-dev
    image: postgres:16.3
    env_file:
      - ../postgres/.env
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d/
    entrypoint: >
      sh -c "chmod +x /docker-entrypoint-initdb.d/init-db.sh && exec docker-entrypoint.sh postgres"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - auth

  auth:
    image: node:20
    container_name: auth-dev
    env_file: ../auth/.env
    working_dir: /app
    volumes:
      - ../auth/:/app
      - /app/node_modules
    command: sh -c "npm install && npm run start:dev"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/notification/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  user:
    build:
      context: ../user
      dockerfile: Dockerfile
    container_name: user-service
    env_file: ../user/.env
    expose:
      - "80"
    volumes:
      - ../user:/app
      - ../migration_module:/app/migration_module
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/user/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  auction:
    build:
      context: ../auction
      dockerfile: Dockerfile
    container_name: auction-service
    env_file: ../auction/.env
    expose:
      - "80"
    volumes:
      - ../auction:/app
      - ../migration_module:/app/migration_module
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/auction/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  docs:
    image: node:20
    container_name: docs-dev
    env_file: ../docs/.env
    working_dir: /app
    volumes:
      - ../docs/:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/docs/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  migration:
    build:
      context: ../migration_module
      dockerfile: Dockerfile
    container_name: migration-dev
    env_file:
      - ../postgres/.env
    working_dir: /app
    volumes:
      - ../migration_module:/app:rw
      - ../user:/usr/src/user:ro
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  app-network:
    driver: bridge
