name: nnk-prod

services:
  postgres:
    container_name: postgres-prod
    image: postgres:16.3
    env_file:
      - ../postgres/.env
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d/
    entrypoint: >
      sh -c "chmod +x /docker-entrypoint-initdb.d/init-db.sh && exec docker-entrypoint.sh postgres"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx-prod
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - auth

  auth:
    image: nnk-auth:latest
    env_file:
      - ../auth/.env
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  notification:
    image: nnk-notification:latest
    env_file:
      - ../notification/.env
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  migration:
    image: nnk-migration:latest
    env_file:
      - ../migration_module/.env
    command: >
      sh -c "
        pip install --no-cache-dir -r requirements.txt &&
        alembic upgrade head
      "
    depends_on:
      - postgres
    networks:
      - app-network

  user:
    image: nnk-user:latest
    env_file:
      - ../notification/.env
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/user/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  auction:
    image: nnk-auction:latest
    env_file:
      - ../notification/.env
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/auction/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  app-network:
    driver: bridge
